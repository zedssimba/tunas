[package]
name = "tunas"
version = "0.6.1"
description = "TUNAS - personal AI for your notebook. S.A.L.T CI"
authors = ["S.A.L.T. CI TECHNOLOGY"]
edition = "2021"

[lib]
name = "tunas_lib"
crate-type = ["rlib"] # the Android build adds "cdylib" (see .github/workflows/android.yml)

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = ["image-png", "image-ico", "custom-protocol"] }
tauri-plugin-dialog = "2"
tauri-plugin-opener = "2"
tauri-plugin-fs = "2"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
rusqlite = { version = "0.32", features = ["bundled"] }
reqwest = { version = "0.12", default-features = false, features = ["rustls-tls", "stream", "json"] }
tokio = { version = "1", features = ["full"] }
futures-util = "0.3"
bytes = "1"
docx-rs = "0.4"
rust_xlsxwriter = "0.90"
pulldown-cmark = { version = "0.13", default-features = false }
genpdf = { version = "0.2", features = ["images"] }
sha2 = "0.10"
hex = "0.4"
sysinfo = "0.33"
zip = { version = "2", default-features = false, features = ["deflate"] }
quick-xml = "0.37"
calamine = "0.38"
pdf-extract = "0.12"
image = { version = "0.25", default-features = false, features = ["png", "jpeg", "ico"] }
resvg = "0.45"
uuid = { version = "1", features = ["v4"] }
chrono = { version = "0.4", features = ["serde"] }
dirs = "5"
anyhow = "1"
base64 = "0.22"
parking_lot = "0.12"
rand = "0.8"
axum = { version = "0.7", default-features = false, features = ["http1", "json", "tokio"] }
tower-http = { version = "0.6", features = ["cors"] }

[target.'cfg(any(windows, target_os = "macos", target_os = "linux"))'.dependencies]
tauri-plugin-single-instance = "2"

[target.'cfg(target_os = "macos")'.dependencies]
security-framework = "3"

[target.'cfg(windows)'.dependencies]
windows-sys = { version = "0.59", features = ["Win32_Foundation", "Win32_System_JobObjects", "Win32_System_Threading", "Win32_Security", "Win32_Security_Cryptography"] }

[profile.release]
codegen-units = 4
lto = "thin"
opt-level = "s"
strip = true
panic = "abort"
