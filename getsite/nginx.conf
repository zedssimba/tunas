server {
    listen 80;
    server_name _;
    root /usr/share/nginx/html;
    index index.html;
    autoindex off;
    server_tokens off;
    charset utf-8;

    types {
        text/html html;
        text/css css;
        application/javascript js;
        application/json json;
        text/markdown md;
        text/plain txt;
        image/svg+xml svg;
        image/png png;
        application/vnd.android.package-archive apk;
        application/x-apple-diskimage dmg;
        application/vnd.microsoft.portable-executable exe;
        application/zip zip;
    }

    # The page, the product list and each update file are always fetched fresh;
    # installers never change once published.
    location = / { add_header Cache-Control "no-cache"; try_files /index.html =404; }
    location = /index.html { add_header Cache-Control "no-cache"; }
    location ~ /(latest|products)\.json$ {
        add_header Cache-Control "no-cache";
        add_header Access-Control-Allow-Origin "*";
    }
    location ~ \.(exe|dmg|apk|zip)$ {
        add_header Cache-Control "public, max-age=31536000, immutable";
        add_header Content-Disposition "attachment";
    }
    location = /health { return 200 "ok\n"; }
}
