# S.A.L.T CI downloads (get.saltci.app): a plain web server for the TUNAS installers and update file.
# Public address: get.saltci.app -> Vultr VPS -> NPM on disti (Let's Encrypt) -> 10.10.10.76:2065
services:
  salt-get:
    image: nginx:1.27-alpine
    container_name: salt-get
    network_mode: bridge
    ports:
      - "2065:80"
    volumes:
      - ./site:/usr/share/nginx/html:ro
      - ./nginx.conf:/etc/nginx/conf.d/default.conf:ro
    restart: unless-stopped
