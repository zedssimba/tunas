    - icon: brain
      color: violet
      title: Universities
      text: Lecturers, students and AI classes, offline in the lab.
    - icon: tablet
      color: gold
      title: OEM and leasing
      text: A co-branded AI app on every notebook shipped.
    - icon: calendar
      color: coral
      title: Trainings
      text: A trainer kit for workshops where every seat runs its own AI.
  - type: sub
    text: TUNAS and TERAS
  - type: table
    head:
    - S.A.L.T TUNAS
    - S.A.L.T TERAS
    widths:
    - 50%
    - 50%
    rows:
    - - One person, on their own notebook or PC
